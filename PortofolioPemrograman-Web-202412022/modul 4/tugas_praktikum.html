<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toko Elektronik Cepat</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .produk-item {
            cursor: pointer;
            transition: 0.3s;
        }

        .produk-item:hover {
            background-color: #e9ecef;
        }

        #gambarProduk {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 10px;
        }

        #output {
            display: none;
        }
    </style>
</head>
<body>

<div class="container py-4">

    <!-- Header -->
    <div class="text-center mb-4">
        <h1 class="fw-bold">Toko Elektronik Cepat</h1>
        <h5 id="waktuSekarang"></h5>
    </div>

    <!-- Display Produk -->
    <div class="row g-4">

        <!-- Produk Utama -->
        <div class="col-lg-8">

            <div class="card shadow">
                <div class="card-body">

                    <img id="gambarProduk" src="" alt="Produk">

                    <div class="text-center mt-3">
                        <button class="btn btn-secondary me-2" onclick="gantiGambar(-1)">
                            Previous
                        </button>

                        <button class="btn btn-secondary" onclick="gantiGambar(1)">
                            Next
                        </button>
                    </div>

                    <div class="mt-4 text-center">
                        <h3 id="namaProduk"></h3>
                        <h4 class="text-success" id="hargaProduk"></h4>
                    </div>

                </div>
            </div>

        </div>

        <!-- Daftar Produk -->
        <div class="col-lg-4">

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    Daftar Produk
                </div>

                <ul class="list-group list-group-flush" id="daftarProduk">
                </ul>
            </div>

        </div>

    </div>

    <!-- Form Pemesanan -->
    <div class="card shadow mt-4">
        <div class="card-header bg-success text-white">
            Form Pemesanan
        </div>

        <div class="card-body">

            <div class="mb-3">
                <label class="form-label">Nama Pemesan</label>
                <input type="text" class="form-control" id="namaPemesan">
            </div>

            <div class="mb-3">
                <label class="form-label">Jumlah Pesan</label>
                <input type="number" class="form-control" id="jumlahPesan">
            </div>

            <div class="mb-3">
                <label class="form-label">Kode Promo</label>
                <input type="text" class="form-control" id="kodePromo">
            </div>

            <button class="btn btn-success" onclick="pesanProduk()">
                Pesan Sekarang
            </button>

        </div>
    </div>

    <!-- Output -->
    <div class="card shadow mt-4" id="output">
        <div class="card-header bg-dark text-white">
            Struk Pemesanan
        </div>

        <div class="card-body" id="hasilPesanan">

        </div>
    </div>

</div>

<script>

    // Array Produk
    const produk = [
        {
            nama: "Laptop Gaming",
            harga: 12000000,
            gambar: [
                "https://images.unsplash.com/photo-1496181133206-80ce9b88a853",
                "https://images.unsplash.com/photo-1517336714739-489689fd1ca8",
                "https://images.unsplash.com/photo-1484788984921-03950022c9ef"
            ]
        },
        {
            nama: "Smartphone",
            harga: 4500000,
            gambar: [
                "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9",
                "https://images.unsplash.com/photo-1598327105666-5b89351aff97",
                "https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c"
            ]
        },
        {
            nama: "Smart TV",
            harga: 7000000,
            gambar: [
                "https://images.unsplash.com/photo-1593784991095-a205069470b6",
                "https://images.unsplash.com/photo-1577979749830-f1d742b96791",
                "https://images.unsplash.com/photo-1461151304267-38535e780c79"
            ]
        }
    ];

    let produkAktif = 0;
    let gambarAktif = 0;

    // Menampilkan Waktu
    function tampilkanWaktu() {
        let sekarang = new Date();

        document.getElementById("waktuSekarang").innerHTML =
            sekarang.toLocaleDateString("id-ID") +
            " | " +
            sekarang.toLocaleTimeString("id-ID");
    }

    setInterval(tampilkanWaktu, 1000);
    tampilkanWaktu();

    // Tampilkan Produk
    function tampilProduk() {

        document.getElementById("gambarProduk").src =
            produk[produkAktif].gambar[gambarAktif];

        document.getElementById("namaProduk").innerHTML =
            produk[produkAktif].nama;

        document.getElementById("hargaProduk").innerHTML =
            "Rp " + produk[produkAktif].harga.toLocaleString("id-ID");
    }

    // Slideshow
    function gantiGambar(arah) {

        gambarAktif += arah;

        if (gambarAktif < 0) {
            gambarAktif =
                produk[produkAktif].gambar.length - 1;
        }

        if (gambarAktif >= produk[produkAktif].gambar.length) {
            gambarAktif = 0;
        }

        tampilProduk();
    }

    // Daftar Produk dengan Perulangan
    function tampilDaftarProduk() {

        let daftar = document.getElementById("daftarProduk");

        for (let i = 0; i < produk.length; i++) {

            daftar.innerHTML += `
                <li class="list-group-item produk-item"
                    onclick="pilihProduk(${i})">
                    ${produk[i].nama}
                </li>
            `;
        }
    }

    function pilihProduk(index) {

        produkAktif = index;
        gambarAktif = 0;

        tampilProduk();
    }

    // Generate Order ID
    function generateOrderID() {

        let angka = Math.floor(
            10000 + Math.random() * 90000
        );

        return "INV-" + angka;
    }

    // Pemesanan
    function pesanProduk() {

        let nama = document.getElementById("namaPemesan").value;
        let jumlah = document.getElementById("jumlahPesan").value;
        let promo = document.getElementById("kodePromo").value;

        // Validasi
        if (nama === "" || jumlah === "") {
            alert("Nama dan jumlah pesanan wajib diisi!");
            return;
        }

        if (jumlah <= 0) {
            alert("Jumlah harus lebih dari 0!");
            return;
        }

        let harga = produk[produkAktif].harga;

        let subtotal = harga * jumlah;

        let diskon = 0;

        // Percabangan Promo
        if (promo.toUpperCase() === "DISKON10") {
            diskon = subtotal * 0.10;
        }

        let total = subtotal - diskon;

        let orderID = generateOrderID();

        document.getElementById("output").style.display = "block";

        document.getElementById("hasilPesanan").innerHTML = `
            <p><strong>Order ID:</strong> ${orderID}</p>
            <p><strong>Nama Pemesan:</strong> ${nama}</p>
            <p><strong>Produk:</strong> ${produk[produkAktif].nama}</p>
            <p><strong>Jumlah:</strong> ${jumlah}</p>
            <p><strong>Subtotal:</strong> Rp ${subtotal.toLocaleString("id-ID")}</p>
            <p><strong>Potongan:</strong> Rp ${diskon.toLocaleString("id-ID")}</p>
            <p><strong>Total Akhir:</strong> Rp ${total.toLocaleString("id-ID")}</p>
        `;
    }

    // Load Awal
    tampilDaftarProduk();
    tampilProduk();

</script>

</body>
</html>
